server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # Uploads to a static site are never legitimate.
    client_max_body_size 1m;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json;

    # ---- Security headers ----
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups"       always;

    # Enable once HTTPS is terminated in front of this container. Turning it on
    # before the certificate works would make the site unreachable for the
    # length of max-age.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy.
    #   'unsafe-inline' for style-src: the app sets inline styles (Framer Motion
    #     animations and the theme objects) that a nonce cannot cover.
    #   accounts.google.com / gstatic: Google Identity Services (admin sign-in).
    #   connect-src must also list the API origin — CHANGE api.mulherviva.com.br
    #     to your real API domain, or the site cannot talk to the backend.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.mulherviva.com.br https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- Caching ----
    # Hashed build assets are immutable: a change produces a new filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg { expires 30d; access_log off; }
    location = /robots.txt  { expires 1d;  access_log off; }
    location = /sitemap.xml { expires 1d;  access_log off; }

    # index.html must never be cached, or visitors keep loading the previous
    # deploy's asset references after an update.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---- SPA fallback ----
    # Any unknown path renders the app, so the /?manage=<token> self-service
    # link from confirmation e-mails survives a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles (.env, .git, editor backups).
    location ~ /\. {
        deny all;
        return 404;
    }
}
